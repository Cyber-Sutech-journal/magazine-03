<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberSutech | ورود</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="nav"><div class="container" style="display:flex;justify-content:space-between;align-items:center">
<a class="brand" href="/"><img src="/assets/cybersutech-logo.png" alt="CyberSutech"><img class="uni" src="/assets/university-logo.jpeg" alt="دانشگاه صنعتی شیراز"></a><a class="back" href="/">صفحه اصلی</a></div></header>
<main class="auth-wrap"><section class="auth-card"><div class="eyebrow">ACCOUNT LOGIN</div><h1>ورود به مجله</h1>
<p>برای ورود، اطلاعات حساب خود را وارد کنید.</p><div id="error" class="error"></div>
<form method="POST" action="/login"><div class="form-group"><label for="username">نام کاربری</label><input id="username" name="username" type="text" placeholder="demo-user" autocomplete="username" required></div>
<div class="form-group"><label for="password">رمز عبور</label><input id="password" name="password" type="password" placeholder="demo-pass" autocomplete="current-password" required></div>
<button class="btn btn-primary" type="submit">ورود به داشبورد</button></form>
<a class="back" href="/register">حساب ندارید؟ ثبت‌نام کنید</a></section></main>
<script>
const e=new URLSearchParams(location.search).get("error"),box=document.getElementById("error");
if(e){box.style.display="block";box.textContent=e==="invalid"?"نام کاربری یا رمز عبور اشتباه است.":"لطفاً فرم را کامل کنید."}
</script></body></html>

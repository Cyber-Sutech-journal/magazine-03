[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-counting"
version = "0.1.0"
description = "Multi-Object Tracking and Directional Counting System for Fixed-Camera Video Analytics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mostafa Mashhadizadeh", email = "mostafa@cybersutech.com" },
]
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.4.128",
    "opencv-python==4.11.0.86",
    "numpy==1.26.4",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "pre-commit==4.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

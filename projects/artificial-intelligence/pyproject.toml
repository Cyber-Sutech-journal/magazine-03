[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-counting"
version = "0.1.0"
description = "Multi-Object Tracking and Directional Counting System for Fixed-Camera Video Analytics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mostafa Mashhadizadeh", email = "mostafa@cybersutech.com" },
]
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.4.128",
    "opencv-python==4.11.0.86",
    "numpy==1.26.4",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "pre-commit==4.6.2",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250915",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as end-to-end integration tests (require real model weights and sample clip)",
]

# Type checker for CI (§15.4 / T21): mypy (not pyright).
# Chosen because it is the common academic/Python default, matches our
# existing .mypy_cache gitignore, and fails the PR with readable per-file errors.
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["mot_counting"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
explicit_package_bases = true

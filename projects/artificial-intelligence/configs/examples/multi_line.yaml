# Example: multi-line counting configuration.
#
# Demonstrates that the schema supports two independent counting lines from
# day one (§7.3), each with its own unique line_id, pixel-coordinate endpoints,
# and positive_direction.  This file loads successfully via load_config().

video:
  path: "data/ci_sample_clip.mp4"
  output_dir: "outputs/"

detection:
  model_variant: "yolo26m"
  imgsz: 640
  confidence_threshold: 0.4
  classes: ["person", "car"]

tracker:
  type: "bytetrack"
  track_thresh: 0.5
  match_thresh: 0.8
  track_buffer: 30

lines:
  - line_id: "entrance"
    point_a: [100, 300]    # top of the entrance zone — absolute pixel coordinates
    point_b: [800, 300]
    positive_direction: "A_to_B"   # left-to-right crossing = IN

  - line_id: "exit"
    point_a: [100, 600]    # bottom of the exit zone — absolute pixel coordinates
    point_b: [800, 600]
    positive_direction: "B_to_A"   # right-to-left crossing = IN

crossing_logic:
  reference_point: "bottom_center"
  history_length: 8
  confirmation_majority_threshold: 0.7
  cooldown_seconds: 1.5
  stale_track_timeout_seconds: 2.0
  min_displacement_px: null
  min_velocity_px_per_s: null

events:
  output_csv: "outputs/events.csv"

evaluation:
  matching_tolerance_seconds: 1.0

visualization:
  output_video: "outputs/annotated.mp4"
  draw_trails: false
